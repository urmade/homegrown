name: auto-merge

# Merges non-harness PRs whose latest ci run is green and whose branch contains current main.
# Runs only main's copy of this workflow and of tools/harness (workflow_run/schedule/dispatch never use PR code),
# so a PR cannot change the rules that merge it. Harness PRs (CODEOWNERS paths) wait for owner review.
# See tools/harness/auto-merge.sh. GITHUB_TOKEN only; never pull_request_target.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
  # Catches anything an event missed (dropped pending runs, re-runs, outages).
  schedule:
    - cron: "*/10 * * * *"
  # ci's hand-off job dispatches this after a GITHUB_TOKEN-started run, passing its run id to wait for.
  workflow_dispatch:
    inputs:
      wait_run: { description: "ci run id to wait for", required: false, default: "" }

permissions:
  contents: write
  pull-requests: write
  actions: write
  issues: write

# One sweep at a time, so merges are serialized and each sees the main the previous one produced.
concurrency:
  group: auto-merge
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - env: { GH_TOKEN: "${{ github.token }}", WAIT_RUN: "${{ inputs.wait_run }}" }
        run: bash tools/harness/auto-merge.sh
