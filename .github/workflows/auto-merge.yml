name: auto-merge

# Non-harness PRs merge themselves. Harness PRs wait for CODEOWNERS review.
# Drafts are ignored. pull_request only; GITHUB_TOKEN only.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  enable:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: skip harness PRs
        id: scope
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          if grep -qE '^(AGENTS\.md|harness\.lock\.json|\.cursor/(rules|skills|agents|hooks)/|\.cursor/hooks\.json|\.github/|tools/harness/)' changed.txt; then
            echo "harness=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.harness != 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh pr merge ${{ github.event.pull_request.number }} --auto --squash
      # A GITHUB_TOKEN merge starts no push run on main; workflow_dispatch is the one event GITHUB_TOKEN may start.
      - name: run CI on main for the merged SHA
        if: steps.scope.outputs.harness != 'true' && github.base_ref == 'main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          state=$(gh pr view ${{ github.event.pull_request.number }} --json state --jq .state)
          if [ "$state" = "MERGED" ]; then
            gh workflow run ci.yml --ref main
            echo "dispatched ci on main at $(gh pr view ${{ github.event.pull_request.number }} --json mergeCommit --jq .mergeCommit.oid)"
          else
            echo "PR is $state (auto-merge queued); no dispatch"
          fi
