name: dispatch-selftest

# Temporary: proves GITHUB_TOKEN with actions: write can dispatch ci.yml and that the dispatched run starts.
on:
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run ci.yml --repo ${{ github.repository }} --ref ${{ github.head_ref }}
